schema: c4a/v1
type: component

component:
  id: contract-generator
  name: Contract Generator
  description: API 契约生成器，从代码生成 OpenAPI/AsyncAPI/Proto 规范
  technology: TypeScript

relationships:
  - to: code-parser
    description: 使用 parseFile 获取代码结构

knowledge:
  responsibility: 根据代码结构生成标准化 API 契约文档
  interfaces:
    - name: generateContract
      description: 生成 API 契约，支持 openapi/asyncapi/proto 格式