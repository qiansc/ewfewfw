schema: c4a/v1
type: component

component:
  id: milvus-client
  name: Milvus Client
  description: Milvus 客户端，负责向量存储和相似度检索
  technology: Python + pymilvus

relationships:
  - to: embedder
    description: 获取文本向量后存储

knowledge:
  responsibility: 封装 Milvus 操作，管理向量索引，提供 ANN 检索
  interfaces:
    - name: upsert
      description: 插入或更新向量
    - name: search
      description: 向量相似度检索
    - name: delete
      description: 删除向量