schema: c4a/v1
type: component

component:
  id: dsl-validator
  name: DSL Validator
  description: DSL 验证组件，使用 JSON Schema 验证 DSL 结构正确性
  technology: TypeScript + ajv

relationships:
  - to: c4a-core
    description: 使用 validateDSL 函数和 JSON Schema
  - to: dsl-parser
    description: 先解析后验证

knowledge:
  responsibility: 验证 DSL 内容符合对应类型的 JSON Schema
  interfaces:
    - name: validateHandler
      description: 验证 DSL 内容，返回 valid/errors 结果