schema: c4a/v1
type: component

component:
  id: local-storage
  name: Local Storage Manager
  description: 本地存储管理组件，封装 .c4a/ 目录的完整生命周期操作
  technology: TypeScript + Node.js fs

relationships:
  - to: dsl-validator
    description: 写入前自动验证

knowledge:
  responsibility: 管理 .c4a/ 目录结构，支持 draft/approved/published/archive 状态流转
  interfaces:
    - name: initHandler
      description: 初始化 .c4a/ 目录结构
    - name: listHandler
      description: 列出 DSL 文件，支持按状态和类型过滤
    - name: readHandler
      description: 读取 DSL 文件内容并自动验证
    - name: writeHandler
      description: 写入 DSL 文件，可选验证
    - name: transitionHandler
      description: 状态流转，移动文件到目标目录