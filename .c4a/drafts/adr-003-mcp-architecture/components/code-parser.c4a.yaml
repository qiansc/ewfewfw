schema: c4a/v1
type: component

component:
  id: code-parser
  name: Code Parser
  description: 代码解析器核心，支持 TypeScript、Go、Python 语法分析
  technology: TypeScript + Regex Parser

knowledge:
  responsibility: 解析代码文件，提取接口、函数、类、导入导出等结构信息
  interfaces:
    - name: parseFile
      description: 解析单个文件，返回 CodeAnalysis 结构
    - name: detectLanguage
      description: 根据文件扩展名检测语言类型
    - name: extractAST
      description: 构建简化 AST 结构