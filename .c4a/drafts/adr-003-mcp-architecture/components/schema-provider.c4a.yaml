schema: c4a/v1
type: component

component:
  id: schema-provider
  name: Schema Provider
  description: JSON Schema 提供组件，返回各类型 DSL 的 Schema 定义
  technology: TypeScript + JSON Schema

relationships:
  - to: c4a-core
    description: 从 core 包读取 Schema 文件

knowledge:
  responsibility: 提供 system/container/component/adr/contract 的 JSON Schema
  interfaces:
    - name: schemaHandler
      description: 获取指定类型的 JSON Schema