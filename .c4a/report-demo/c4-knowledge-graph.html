<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C4A Architecture Knowledge Graph</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
        #graph-container { width: 100vw; height: 100vh; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }

        /* Node styles */
        .node { cursor: pointer; }
        .node circle { stroke-width: 3px; transition: all 0.3s; }
        .node:hover circle { stroke-width: 5px; filter: brightness(1.2); }
        .node.selected circle { stroke-width: 6px; filter: drop-shadow(0 0 12px currentColor); }
        .node text { font-size: 12px; fill: #e2e8f0; pointer-events: none; font-weight: 500; }

        /* Link styles */
        .link { stroke-opacity: 0.6; transition: all 0.3s; }
        .link:hover { stroke-opacity: 1; stroke-width: 3px !important; }
        .link-label { font-size: 10px; fill: #94a3b8; pointer-events: none; }

        /* Legend */
        #legend { position: absolute; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.9); border-radius: 12px; padding: 16px; border: 1px solid #334155; }
        #legend h3 { color: #f1f5f9; margin: 0 0 12px 0; font-size: 14px; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: #cbd5e1; font-size: 12px; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }

        /* Detail Panel */
        #detail-panel {
            position: absolute; top: 20px; right: 20px; width: 380px;
            background: rgba(15, 23, 42, 0.95); border-radius: 12px;
            border: 1px solid #334155; overflow: hidden;
            transform: translateX(420px); transition: transform 0.3s ease;
        }
        #detail-panel.open { transform: translateX(0); }
        #detail-header { padding: 16px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        #detail-header h2 { color: #f1f5f9; margin: 0; font-size: 16px; }
        #detail-close { background: none; border: none; color: #64748b; cursor: pointer; font-size: 20px; }
        #detail-close:hover { color: #f1f5f9; }
        #detail-content { padding: 20px; color: #cbd5e1; max-height: calc(100vh - 120px); overflow-y: auto; }
        #detail-content h3 { color: #f1f5f9; font-size: 14px; margin: 16px 0 8px 0; }
        #detail-content h3:first-child { margin-top: 0; }
        #detail-content p { margin: 0 0 12px 0; font-size: 13px; line-height: 1.6; }
        #detail-content ul { margin: 0; padding-left: 20px; font-size: 13px; }
        #detail-content li { margin-bottom: 4px; }
        .detail-tag { display: inline-block; padding: 2px 8px; font-size: 11px; border-radius: 4px; margin-right: 4px; margin-bottom: 4px; }
        .detail-tag-blue { background: #1e40af; color: #bfdbfe; }
        .detail-tag-green { background: #166534; color: #bbf7d0; }
        .detail-tag-purple { background: #6b21a8; color: #e9d5ff; }
        .detail-tag-orange { background: #c2410c; color: #fed7aa; }
        .tool-badge { display: inline-block; background: #1e293b; border: 1px solid #475569; padding: 2px 6px; font-size: 11px; border-radius: 4px; margin: 2px; font-family: monospace; }
        .related-link { color: #60a5fa; cursor: pointer; text-decoration: underline; }
        .related-link:hover { color: #93c5fd; }

        /* Controls */
        #controls { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 8px; }
        #controls button { background: rgba(30, 41, 59, 0.9); border: 1px solid #475569; color: #e2e8f0; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        #controls button:hover { background: #334155; border-color: #60a5fa; }

        /* Title */
        #title { position: absolute; bottom: 20px; right: 20px; text-align: right; }
        #title h1 { color: #f1f5f9; margin: 0; font-size: 24px; font-weight: 600; }
        #title p { color: #64748b; margin: 4px 0 0 0; font-size: 12px; }

        /* Tooltip */
        #tooltip {
            position: absolute; background: rgba(15, 23, 42, 0.95); border: 1px solid #475569;
            border-radius: 8px; padding: 12px 16px; pointer-events: none; opacity: 0;
            transition: opacity 0.2s; max-width: 300px; z-index: 1000;
        }
        #tooltip h4 { color: #f1f5f9; margin: 0 0 4px 0; font-size: 14px; }
        #tooltip p { color: #94a3b8; margin: 0; font-size: 12px; }
    </style>
</head>
<body>
    <div id="graph-container"></div>

    <div id="legend">
        <h3>Node Types</h3>
        <div class="legend-item"><div class="legend-dot" style="background: #f59e0b;"></div> System</div>
        <div class="legend-item"><div class="legend-dot" style="background: #3b82f6;"></div> Container</div>
        <div class="legend-item"><div class="legend-dot" style="background: #8b5cf6;"></div> ADR</div>
        <div class="legend-item"><div class="legend-dot" style="background: #64748b;"></div> External</div>
        <h3 style="margin-top: 16px;">Link Types</h3>
        <div class="legend-item"><div style="width: 24px; height: 2px; background: #60a5fa;"></div> depends on</div>
        <div class="legend-item"><div style="width: 24px; height: 2px; background: #a78bfa;"></div> affects</div>
        <div class="legend-item"><div style="width: 24px; height: 2px; background: #94a3b8; border-style: dashed;"></div> external</div>
    </div>

    <div id="detail-panel">
        <div id="detail-header">
            <h2 id="detail-title">Details</h2>
            <button id="detail-close" onclick="closePanel()">&times;</button>
        </div>
        <div id="detail-content"></div>
    </div>

    <div id="controls">
        <button onclick="resetZoom()">Reset View</button>
        <button onclick="toggleLabels()">Toggle Labels</button>
        <button onclick="highlightADRs()">Highlight ADRs</button>
    </div>

    <div id="title">
        <h1>C4A Knowledge Graph</h1>
        <p>Click nodes to view details | Drag to rearrange | Scroll to zoom</p>
    </div>

    <div id="tooltip"><h4></h4><p></p></div>

    <script>
    // Knowledge Graph Data
    const graphData = {
        nodes: [
            // System
            { id: "c4a", name: "C4A", type: "system", description: "基于 C4 模型扩展的架构知识管理平台", tags: ["architecture", "knowledge-management", "ai-agent", "mcp"] },

            // Containers
            { id: "c4a-cli", name: "c4a-cli", type: "container", description: "交互式命令行工具，提供开发和运维操作的统一入口", tech: { language: "TypeScript", framework: "Ink", runtime: "Bun" } },
            { id: "c4a-core", name: "c4a-core", type: "container", description: "共享核心库，提供 DSL 类型定义、Schema 验证、工具函数", tech: { language: "TypeScript", framework: "Zod + AJV", runtime: "Bun" } },
            { id: "c4a-dsl-mcp", name: "c4a-dsl-mcp", type: "container", description: "DSL 解析验证 MCP Server", tech: { language: "TypeScript", framework: "MCP SDK", runtime: "Bun", port: 8051 }, tools: ["c4a_dsl_parse", "c4a_dsl_validate", "c4a_dsl_generate", "c4a_dsl_schema", "c4a_local_init_repo", "c4a_local_list_files", "c4a_local_read_file", "c4a_local_write_file", "c4a_local_transition_status"] },
            { id: "c4a-code-mcp", name: "c4a-code-mcp", type: "container", description: "代码分析 MCP Server，提供代码模块提取、依赖分析、契约生成能力", tech: { language: "TypeScript", framework: "MCP SDK", runtime: "Bun", port: 8052 }, tools: ["c4a_code_extract", "c4a_code_analyze", "c4a_code_ast", "c4a_code_contract"] },
            { id: "c4a-data-mcp", name: "c4a-data-mcp", type: "container", description: "统一数据服务 MCP Server，封装 MongoDB/Neo4j/Milvus 三库操作", tech: { language: "Python", framework: "FastAPI + MCP", runtime: "Python 3.11+", port: 8050 }, tools: ["c4a_db_save_entity", "c4a_db_get_entity", "c4a_db_delete_entity", "c4a_db_search_semantic", "c4a_db_query_deps", "c4a_db_query_impact", "c4a_db_sync_file", "c4a_db_sync_local", "c4a_db_exec_cypher"] },
            { id: "config-generator", name: "config-generator", type: "container", description: "配置生成器，从统一配置生成各 Agent 基座的配置文件", tech: { language: "TypeScript", framework: "Zod", runtime: "Bun" }, platforms: ["OpenCode", "Claude SDK", "Cursor"] },

            // External
            { id: "mongodb", name: "MongoDB", type: "external", description: "主存储，存放 DSL 文档和元数据", criticality: "critical" },
            { id: "neo4j", name: "Neo4j", type: "external", description: "图索引，存放依赖关系和调用链", criticality: "high" },
            { id: "milvus", name: "Milvus", type: "external", description: "向量索引，支持语义搜索", criticality: "high" },

            // ADRs
            { id: "adr-001", name: "ADR-001", type: "adr", title: "C4A v0.2 架构重构", description: "基于 Agent + MCP 的架构设计", date: "2026-01-07", status: "published", decision: ["Agent 化：将核心能力拆分为独立 Agent", "MCP 优先：所有工具能力通过 MCP Server 暴露", "配置驱动：统一配置作为所有基座配置的源", "本地优先 + 三库同步"] },
            { id: "adr-002", name: "ADR-002", type: "adr", title: "多基座兼容设计", description: "统一配置与配置生成器", date: "2026-01-07", status: "published", decision: ["统一配置源：c4a.config.yaml", "配置生成器：适配器模式", "Prompt 共享", "工具名称解析器"] }
        ],
        links: [
            // System contains containers
            { source: "c4a", target: "c4a-cli", type: "contains" },
            { source: "c4a", target: "c4a-core", type: "contains" },
            { source: "c4a", target: "c4a-dsl-mcp", type: "contains" },
            { source: "c4a", target: "c4a-code-mcp", type: "contains" },
            { source: "c4a", target: "c4a-data-mcp", type: "contains" },
            { source: "c4a", target: "config-generator", type: "contains" },

            // Container dependencies
            { source: "c4a-cli", target: "c4a-dsl-mcp", type: "manages", label: "manages" },
            { source: "c4a-cli", target: "c4a-code-mcp", type: "manages", label: "manages" },
            { source: "c4a-cli", target: "c4a-data-mcp", type: "manages", label: "manages" },
            { source: "c4a-dsl-mcp", target: "c4a-core", type: "imports", label: "imports" },
            { source: "c4a-code-mcp", target: "c4a-core", type: "imports", label: "imports" },
            { source: "config-generator", target: "c4a-core", type: "imports", label: "imports" },

            // External dependencies
            { source: "c4a-data-mcp", target: "mongodb", type: "external", label: "stores" },
            { source: "c4a-data-mcp", target: "neo4j", type: "external", label: "indexes" },
            { source: "c4a-data-mcp", target: "milvus", type: "external", label: "vectors" },

            // ADR affects
            { source: "adr-001", target: "c4a", type: "affects", label: "defines" },
            { source: "adr-002", target: "config-generator", type: "affects", label: "affects" },
            { source: "adr-002", target: "c4a-cli", type: "affects", label: "affects" },
            { source: "adr-002", target: "c4a-core", type: "affects", label: "affects" }
        ]
    };

    // Colors
    const colors = {
        system: "#f59e0b",
        container: "#3b82f6",
        adr: "#8b5cf6",
        external: "#64748b"
    };

    const linkColors = {
        contains: "#475569",
        imports: "#60a5fa",
        manages: "#60a5fa",
        external: "#64748b",
        affects: "#a78bfa"
    };

    // Setup
    const width = window.innerWidth;
    const height = window.innerHeight;
    let showLabels = true;
    let selectedNode = null;

    const svg = d3.select("#graph-container")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

    // Zoom
    const zoom = d3.zoom()
        .scaleExtent([0.3, 3])
        .on("zoom", (event) => g.attr("transform", event.transform));

    svg.call(zoom);
    const g = svg.append("g");

    // Arrow markers
    const defs = svg.append("defs");
    Object.entries(linkColors).forEach(([type, color]) => {
        defs.append("marker")
            .attr("id", `arrow-${type}`)
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 25)
            .attr("refY", 0)
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .attr("orient", "auto")
            .append("path")
            .attr("fill", color)
            .attr("d", "M0,-5L10,0L0,5");
    });

    // Simulation
    const simulation = d3.forceSimulation(graphData.nodes)
        .force("link", d3.forceLink(graphData.links).id(d => d.id).distance(d => d.type === "contains" ? 80 : 150))
        .force("charge", d3.forceManyBody().strength(-400))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(50));

    // Links
    const link = g.append("g")
        .selectAll("line")
        .data(graphData.links)
        .join("line")
        .attr("class", "link")
        .attr("stroke", d => linkColors[d.type] || "#475569")
        .attr("stroke-width", d => d.type === "contains" ? 1 : 2)
        .attr("stroke-dasharray", d => d.type === "external" ? "5,5" : null)
        .attr("marker-end", d => d.type !== "contains" ? `url(#arrow-${d.type})` : null);

    // Link labels
    const linkLabel = g.append("g")
        .selectAll("text")
        .data(graphData.links.filter(d => d.label))
        .join("text")
        .attr("class", "link-label")
        .text(d => d.label);

    // Nodes
    const node = g.append("g")
        .selectAll("g")
        .data(graphData.nodes)
        .join("g")
        .attr("class", "node")
        .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended))
        .on("click", (event, d) => selectNode(d))
        .on("mouseover", showTooltip)
        .on("mouseout", hideTooltip);

    node.append("circle")
        .attr("r", d => d.type === "system" ? 30 : d.type === "adr" ? 22 : 24)
        .attr("fill", d => colors[d.type])
        .attr("stroke", d => d3.color(colors[d.type]).brighter(0.5));

    node.append("text")
        .attr("dy", d => d.type === "system" ? 45 : 38)
        .attr("text-anchor", "middle")
        .text(d => d.name);

    // Node icons
    node.append("text")
        .attr("dy", 5)
        .attr("text-anchor", "middle")
        .attr("font-size", d => d.type === "system" ? 16 : 14)
        .attr("fill", "white")
        .text(d => {
            if (d.type === "system") return "S";
            if (d.type === "container") return "C";
            if (d.type === "adr") return "A";
            if (d.type === "external") return "E";
        });

    // Simulation tick
    simulation.on("tick", () => {
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        linkLabel
            .attr("x", d => (d.source.x + d.target.x) / 2)
            .attr("y", d => (d.source.y + d.target.y) / 2);

        node.attr("transform", d => `translate(${d.x},${d.y})`);
    });

    // Drag functions
    function dragstarted(event) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
    }

    function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
    }

    function dragended(event) {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
    }

    // Tooltip
    function showTooltip(event, d) {
        const tooltip = document.getElementById("tooltip");
        tooltip.querySelector("h4").textContent = d.name;
        tooltip.querySelector("p").textContent = d.description || d.title || "";
        tooltip.style.left = (event.pageX + 15) + "px";
        tooltip.style.top = (event.pageY - 10) + "px";
        tooltip.style.opacity = 1;
    }

    function hideTooltip() {
        document.getElementById("tooltip").style.opacity = 0;
    }

    // Node selection and detail panel
    function selectNode(d) {
        // Update selection state
        node.classed("selected", n => n.id === d.id);
        selectedNode = d;

        // Build detail content
        let html = "";

        if (d.type === "system") {
            html += `<p>${d.description}</p>`;
            html += `<h3>Tags</h3><div>${d.tags.map(t => `<span class="detail-tag detail-tag-blue">${t}</span>`).join("")}</div>`;
            html += `<h3>Containers</h3><ul>`;
            graphData.links.filter(l => l.source.id === d.id && l.type === "contains").forEach(l => {
                html += `<li><span class="related-link" onclick="navigateTo('${l.target.id}')">${l.target.name}</span></li>`;
            });
            html += `</ul>`;
        } else if (d.type === "container") {
            html += `<p>${d.description}</p>`;
            html += `<h3>Technology</h3>`;
            if (d.tech) {
                html += `<div>`;
                html += `<span class="detail-tag detail-tag-green">${d.tech.language}</span>`;
                html += `<span class="detail-tag detail-tag-blue">${d.tech.framework}</span>`;
                html += `<span class="detail-tag detail-tag-purple">${d.tech.runtime}</span>`;
                if (d.tech.port) html += `<span class="detail-tag detail-tag-orange">Port ${d.tech.port}</span>`;
                html += `</div>`;
            }
            if (d.tools) {
                html += `<h3>MCP Tools</h3><div>${d.tools.map(t => `<span class="tool-badge">${t}</span>`).join("")}</div>`;
            }
            if (d.platforms) {
                html += `<h3>Target Platforms</h3><ul>${d.platforms.map(p => `<li>${p}</li>`).join("")}</ul>`;
            }
            // Dependencies
            const deps = graphData.links.filter(l => l.source.id === d.id && l.type !== "contains");
            if (deps.length) {
                html += `<h3>Dependencies</h3><ul>`;
                deps.forEach(l => {
                    html += `<li><span class="related-link" onclick="navigateTo('${l.target.id}')">${l.target.name}</span> <span style="color:#64748b">(${l.label || l.type})</span></li>`;
                });
                html += `</ul>`;
            }
            // Affected by ADRs
            const affectedBy = graphData.links.filter(l => l.target.id === d.id && l.type === "affects");
            if (affectedBy.length) {
                html += `<h3>Related ADRs</h3><ul>`;
                affectedBy.forEach(l => {
                    const adr = graphData.nodes.find(n => n.id === l.source.id);
                    html += `<li><span class="related-link" onclick="navigateTo('${l.source.id}')">${adr.name}</span>: ${adr.title}</li>`;
                });
                html += `</ul>`;
            }
        } else if (d.type === "adr") {
            html += `<div><span class="detail-tag detail-tag-green">${d.status}</span> <span style="color:#64748b">${d.date}</span></div>`;
            html += `<h3>${d.title}</h3>`;
            html += `<p>${d.description}</p>`;
            html += `<h3>Decision</h3><ul>${d.decision.map(dec => `<li>${dec}</li>`).join("")}</ul>`;
            // Affects
            const affects = graphData.links.filter(l => l.source.id === d.id && l.type === "affects");
            if (affects.length) {
                html += `<h3>Affects</h3><ul>`;
                affects.forEach(l => {
                    html += `<li><span class="related-link" onclick="navigateTo('${l.target.id}')">${l.target.name}</span></li>`;
                });
                html += `</ul>`;
            }
        } else if (d.type === "external") {
            html += `<p>${d.description}</p>`;
            html += `<h3>Criticality</h3><span class="detail-tag detail-tag-${d.criticality === 'critical' ? 'orange' : 'purple'}">${d.criticality}</span>`;
            // Used by
            const usedBy = graphData.links.filter(l => l.target.id === d.id);
            if (usedBy.length) {
                html += `<h3>Used By</h3><ul>`;
                usedBy.forEach(l => {
                    html += `<li><span class="related-link" onclick="navigateTo('${l.source.id}')">${l.source.name}</span></li>`;
                });
                html += `</ul>`;
            }
        }

        document.getElementById("detail-title").textContent = d.name;
        document.getElementById("detail-content").innerHTML = html;
        document.getElementById("detail-panel").classList.add("open");

        // Highlight connected nodes and links
        highlightConnections(d);
    }

    function highlightConnections(d) {
        const connectedIds = new Set([d.id]);
        graphData.links.forEach(l => {
            if (l.source.id === d.id) connectedIds.add(l.target.id);
            if (l.target.id === d.id) connectedIds.add(l.source.id);
        });

        node.style("opacity", n => connectedIds.has(n.id) ? 1 : 0.3);
        link.style("opacity", l => l.source.id === d.id || l.target.id === d.id ? 1 : 0.1);
    }

    function closePanel() {
        document.getElementById("detail-panel").classList.remove("open");
        node.classed("selected", false).style("opacity", 1);
        link.style("opacity", 0.6);
        selectedNode = null;
    }

    function navigateTo(id) {
        const targetNode = graphData.nodes.find(n => n.id === id);
        if (targetNode) {
            selectNode(targetNode);
            // Pan to node
            svg.transition().duration(500).call(
                zoom.transform,
                d3.zoomIdentity.translate(width/2 - targetNode.x, height/2 - targetNode.y)
            );
        }
    }

    // Control functions
    function resetZoom() {
        svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
        closePanel();
    }

    function toggleLabels() {
        showLabels = !showLabels;
        node.selectAll("text").style("opacity", showLabels ? 1 : 0);
        linkLabel.style("opacity", showLabels ? 1 : 0);
    }

    function highlightADRs() {
        const adrIds = graphData.nodes.filter(n => n.type === "adr").map(n => n.id);
        const affectedIds = new Set(adrIds);
        graphData.links.forEach(l => {
            if (adrIds.includes(l.source.id)) affectedIds.add(l.target.id);
        });

        node.style("opacity", n => affectedIds.has(n.id) ? 1 : 0.2);
        link.style("opacity", l => adrIds.includes(l.source.id) ? 1 : 0.1);
    }

    // Window resize
    window.addEventListener("resize", () => {
        svg.attr("width", window.innerWidth).attr("height", window.innerHeight);
        simulation.force("center", d3.forceCenter(window.innerWidth / 2, window.innerHeight / 2));
        simulation.alpha(0.3).restart();
    });
    </script>
</body>
</html>
