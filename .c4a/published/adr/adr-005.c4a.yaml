schema: c4a/v1
type: adr
adr:
  id: ADR-005
  title: 引入 mcp-visual 服务，实现知识可视化能力
  status: published
  date: 2026-01-12
  authors: []
  reviewers: []
  approved_by: AI Agent
context: |
  C4A 当前专注于架构知识的生产（DSL 解析、代码分析、数据服务），
  缺乏将知识可视化呈现的能力。用户希望能够：

  1. 生成架构图、概念图等视觉内容
  2. 在报告中嵌入 AI 生成的图片
  3. 使用提示词模板系统提高图片生成的一致性
  4. 灵活管理图片存储（临时缓存、永久存储、报告专属）

  调研显示 Google Gemini 3 Pro Image (Nano Banana Pro) 提供：
  - 高质量图片生成（2K/4K）
  - 卓越的文本渲染（94% 准确性）
  - 多语言支持
  - 合理的定价（$0.134-$0.24/张）

  通过新增独立的 mcp-visual 服务，可以：
  - 完全解耦现有系统
  - 保持架构一致性（与 mcp-data、mcp-dsl、mcp-code 统一）
  - 易于扩展未来可视化能力
decision: |
  引入 mcp-visual MCP 服务，提供知识可视化能力。

  ✅ 状态：立即实施

  ## 服务架构
  - 独立的 MCP 服务
  - 使用 TypeScript + Bun 运行时
  - 本地开发使用 stdio 模式（IDE 自动拉起），Docker 部署使用 HTTP 模式
  - 遵循 MCP 协议，与 mcp-dsl、mcp-code 保持一致架构（stdio 优先）

  ## 核心能力

  ### 图片生成
  - 集成 Gemini 3 Pro Image API
  - 默认分辨率：2K
  - 支持宽高比：1:1, 16:9, 9:16, 4:3, 3:4
  - 支持格式：PNG、JPEG

  ### 图表渲染
  - Mermaid 渲染器（流程图、时序图、架构图）
  - C4 架构图生成（基于 Neo4j 数据）
  - 支持 SVG、PNG 输出

  ### 提示词模板系统
  - 模板目录：prompts/visual-templates/
  - 支持变量替换（Handlebars）
  - 支持模板继承
  - 分类管理（architecture、flowchart、image）
  - 默认模板配置

  ## 存储策略

  ### 三种存储模式
  - cache：临时缓存（.c4a/cache/visual/temp/）
  - permanent：永久存储（.c4a/assets/images/）
  - report：报告专属（.c4a/reports/{report-id}/images/）

  ### 引用方式
  - relative：相对路径
  - absolute：绝对路径
  - url：URL（需配置静态文件服务器）
  - markdown：Markdown 格式（![alt](path)）

  ### 元数据追踪
  - 生成参数（prompt、template、model）
  - 上下文关联（reportId、entityId）
  - 自动清理临时文件

  ## 配置管理
  - 环境变量：MCP_TRANSPORT（stdio/streamable-http）、MCP_PORT（仅 HTTP 模式）
  - API 配置：GEMINI_API_KEY
  - 存储配置：VISUAL_STORAGE_BASE_PATH
  - 模板配置：VISUAL_TEMPLATES_PATH、VISUAL_DEFAULT_TEMPLATE

  ## 集成方式
  - 通过 MCP 工具暴露给 Agent
  - 与现有系统完全解耦，无直接依赖
consequences:
  positive:
    - 提供架构知识可视化能力，提升用户体验
    - 完全解耦现有系统，不影响当前功能
    - 与现有 mcp-* 服务保持架构一致性
    - 灵活的存储策略，支持不同场景
  negative:
    - 增加一个新服务，增加部署复杂度
    - 依赖 Google Gemini API，存在外部依赖风险
    - 图片生成产生存储成本
  neutral:
    - 需要学习新的可视化工具
affects:
  - element_type: system
    element_id: c4a
    scope: 新增 mcp-visual 容器，扩展系统可视化能力
