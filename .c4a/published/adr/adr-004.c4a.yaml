schema: c4a/v1
type: adr
adr:
  id: ADR-004
  title: 架构知识完整覆盖 - 补充非 MCP 容器的组件定义
  status: published
  date: 2026-01-11
  authors:
    - C4A Team
  reviewers: []
  approved_by: User
context: >
  通过对比 `.c4a/published/` 已发布的架构知识与 `packages/` 实际代码结构（以代码为准），发现存在覆盖不完整的情况。


  当前已发布的架构知识：

  - 系统：1 个（c4a）

  - 容器：6 个（c4a-cli, c4a-core, c4a-dsl-mcp, c4a-code-mcp, c4a-data-mcp,
  config-generator）

  - 组件：16 个（全部属于 MCP 服务层）

  - ADR：3 个


  实际代码结构分析（以代码为准）：


  **packages/cli/src/**

  - App.tsx - 主应用，管理菜单状态和键盘输入

  - menuData.ts - 菜单数据定义

  - commands/index.ts - 命令处理器（runCommand 函数，处理 dev/docker/prod/debug 等命令）

  - components/ - CascadeMenu, Header, HelpPanel, ConfirmDialog

  - utils/process.ts - 进程管理（startMcpData, startTtyd, generateOpencodeConfig 等）

  - utils/docker.ts - Docker 操作（startStorageServices, stopServices, checkDocker
  等）


  **packages/config-generator/src/**

  - generator.ts - ConfigGenerator 类，协调各适配器

  - schema.ts - UnifiedConfigSchema (Zod)

  - validator.ts - validateConfig 函数

  - toolResolver.ts - 工具名称解析器（expandToolPatterns, toClaudeSdkToolName）

  - types.ts - 类型定义

  - adapters/base.ts - BaseAdapter 抽象类

  - adapters/opencode.ts, claudeSdk.ts, cursor.ts - 三个平台适配器

  - utils/logger.ts, fileUtils.ts - 工具函数


  **packages/core/src/**

  - types/dsl.ts - DSL 类型定义（SystemDSL, ContainerDSL, ComponentDSL, ADRDSL,
  ContractDSL）

  - types/index.ts - 内部业务类型

  - schemas/ - 10 个 JSON Schema 文件（c4a-system, c4a-container, c4a-component,
  c4a-adr 等）

  - validator/ajvInstance.ts - AJV 验证器单例

  - utils/index.ts - 工具函数（parseDSL, stringifyDSL, generateId, now）


  **prompts/** (实际实现的 Agent，非 RFC 中的 8 个)

  - c4a.md - 主 Agent（全功能）

  - c4a-plan.md - 规划 Agent（只读）

  - c4a-dsl.md - DSL Agent

  - c4a-query.md - 查询 Agent

  - skills/ - 4 个 Skill（adr-draft, adr-review, adr-status, research）


  **MCP 工具对比**（代码 vs RFC）：

  - c4a-data-mcp 实际有 9 个工具（包括 c4a_db_sync_file），RFC 中只描述了 8 个

  - c4a_db_sync_file 是后来新增的，用于逐文件同步以避免超时


  发现的差距：

  1. **c4a-cli 缺少组件定义**：有明确的模块划分但没有组件定义

  2. **config-generator 缺少组件定义**：容器描述虽然详细，但没有组件级定义

  3. **c4a-core 缺少组件定义**：共享核心库缺少组件定义

  4. **Agent 实际只有 4 个**：RFC 描述了 8 个，但实际只实现了 4 个（c4a, c4a-plan, c4a-dsl,
  c4a-query）


  5. **缺少外部存储服务定义**：MongoDB, Neo4j, Milvus, Ollama 没有容器定义

  6. **缺少基础设施配置知识**：docker-compose.yml 和 .env 配置没有组件定义


  这导致：

  - AI Agent 无法全面理解项目的模块结构

  - 依赖查询和影响分析覆盖不完整

  - 代码变更时难以追踪影响范围

  - 基础设施升级时缺少配置变更的影响分析
decision: |
  补充缺失的组件定义，实现架构知识对代码的完整覆盖：

  1. **为 c4a-cli 添加 7 个组件定义**
     - cli-app: 主应用入口 (App.tsx)
     - cli-command-handler: 命令处理器 (commands/index.ts)
     - cli-cascade-menu: 级联菜单组件 (components/CascadeMenu.tsx)
     - cli-process-manager: 进程管理工具 (utils/process.ts)
     - cli-docker-utils: Docker 操作工具 (utils/docker.ts)
     - cli-menu-data: 菜单数据定义 (menuData.ts)
     - cli-confirm-dialog: 确认对话框组件 (components/ConfirmDialog.tsx)

  2. **为 config-generator 添加 10 个组件定义**
     - config-schema: 配置 Schema 定义 (schema.ts)
     - config-generator-core: 配置生成器核心 (generator.ts)
     - config-validator: 配置验证器 (validator.ts)
     - tool-resolver: 工具名称解析器 (toolResolver.ts)
     - adapter-base: 适配器抽象基类 (adapters/base.ts)
     - opencode-adapter: OpenCode 适配器 (adapters/opencode.ts)
     - claudesdk-adapter: Claude SDK 适配器 (adapters/claudeSdk.ts)
     - cursor-adapter: Cursor 适配器 (adapters/cursor.ts)
     - config-cli: CLI 入口 (index.ts)
     - config-types: 类型定义 (types.ts)

  3. **为 c4a-core 添加 7 个组件定义**
     - dsl-types: DSL 类型定义 (types/dsl.ts)
     - json-schemas: JSON Schema 集合 (schemas/*.schema.json)
     - ajv-validator: AJV 验证实例 (validator/ajvInstance.ts)
     - core-utils: 核心工具函数 (utils/index.ts)
     - internal-types: 内部业务类型 (types/index.ts)
     - dsl-converter: DSL 类型转换器 (utils/converter.ts)
     - validator-api: 验证 API 入口 (validator/index.ts)

  4. **为 c4a-data-mcp 添加 1 个组件定义**
     - data-config: 配置管理 (config.py)

  5. **Agent 暂不添加架构实体**
     - 实际只实现了 4 个 Agent（c4a, c4a-plan, c4a-dsl, c4a-query）
     - Agent 定义在 prompts/*.md 中，属于配置层面
     - Agent 的工具权限已在 c4a.config.yaml 中定义
     - 未来可考虑添加 Agent 类型的 DSL Schema

  6. **添加 4 个外部存储服务容器定义**
     - mongodb: 文档数据库，存储 C4A 实体主数据
     - neo4j: 图数据库，存储依赖关系用于图遍历查询
     - milvus: 向量数据库，存储文本向量用于语义搜索
     - ollama: 本地 LLM 推理服务，提供 Embedding 能力

  7. **添加 2 个基础设施配置组件**
     - docker-compose-config: Docker Compose 编排配置
     - env-config: 环境变量配置模板
consequences:
  positive:
    - 架构知识完整覆盖所有代码模块
    - AI Agent 能更准确理解项目结构
    - 依赖查询和影响分析更全面
    - 代码变更时可追踪完整影响范围
    - 组件定义与实际代码一一对应（已通过代码验证）
    - 外部存储服务有明确的容器定义，便于版本升级影响分析
    - 基础设施配置纳入知识管理，配置变更可追踪
  negative:
    - 需要维护更多的定义文件（新增 27 个组件 + 4 个外部容器）
    - 组件定义需与代码保持同步
    - 外部服务版本升级时需同步更新容器定义
  neutral:
    - 组件粒度选择为中等（一个模块文件或一个功能目录对应一个组件）
    - 本次只补充非 MCP 容器的组件，MCP 服务层已有完整定义
    - 外部服务使用 external: true 标记，与内部容器区分
alternatives:
  - name: 保持现状
    description: 仅为 MCP 服务定义组件，CLI 和配置生成器保持容器级别描述
    pros:
      - 维护成本低
    cons:
      - 架构知识覆盖不完整
      - AI Agent 理解项目结构受限
  - name: 更细粒度的组件定义
    description: 为每个函数或类定义组件
    pros:
      - 覆盖更精细
    cons:
      - 维护成本过高
      - 信噪比低
  - name: 添加 Agent 实体定义
    description: 为每个 Agent 创建 DSL 定义
    pros:
      - Agent 也纳入知识管理
    cons:
      - 需要新增 Agent 类型的 DSL Schema
      - Agent 定义与 prompts/*.md 存在重复
affects:
  - element_type: container
    element_id: c4a-cli
    scope: 添加 7 个组件定义
  - element_type: container
    element_id: config-generator
    scope: 添加 10 个组件定义
  - element_type: container
    element_id: c4a-core
    scope: 添加 7 个组件定义
  - element_type: container
    element_id: c4a-data-mcp
    scope: 添加 1 个组件定义 (data-config)
  - element_type: system
    element_id: c4a
    scope: 添加 4 个外部存储服务容器 (mongodb, neo4j, milvus, ollama)
  - element_type: infrastructure
    element_id: docker-compose
    scope: 添加 Docker Compose 编排配置组件
  - element_type: infrastructure
    element_id: env-config
    scope: 添加环境变量配置组件
related:
  related_adrs:
    - ADR-001
    - ADR-003
