schema: c4a/v1
type: component
component:
  id: claudesdk-adapter
  name: Claude SDK Adapter
  description: Claude Code SDK 平台适配器，生成 .claude/ 目录配置
  technology: TypeScript
relationships:
  - to: adapter-base
    description: 继承适配器基类
  - to: tool-resolver
    description: 使用工具解析器转换名称格式
knowledge:
  responsibility: 将统一配置转换为 Claude Code SDK 格式，生成 settings.json 和 commands/*.md 文件
  how:
    description: |
      源码位置: packages/config-generator/src/adapters/claudeSdk.ts

      输出文件:
      - .mcp.json: MCP Server 配置
      - .claude/settings.json: 权限配置
      - .claude/commands/*.md: Skill 命令文件

      转换规则:
      - 工具名称添加 mcp__ 前缀
      - 系统工具首字母大写 (read → Read)
      - 通配符展开为显式工具列表
  interfaces:
    - name: ClaudeSdkAdapter
      description: Claude SDK 适配器类
