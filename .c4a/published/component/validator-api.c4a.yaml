schema: c4a/v1
type: component
component:
  id: validator-api
  name: Validator API
  description: DSL 验证 API 入口，提供验证函数和类型导出
  technology: TypeScript + AJV
relationships:
  - to: ajv-validator
    description: 使用 AJV 实例进行验证
  - to: core-utils
    description: 使用 parseDSL 解析 YAML
knowledge:
  responsibility: 提供 DSL 验证的公开 API
  how:
    description: |
      源码位置: packages/core/src/validator/index.ts

      验证函数:
      - validateDSL(data, type): 验证已解析的 DSL 对象
      - validateDSLString(content, type): 验证 YAML 字符串
      - validateDSLAuto(data): 自动检测类型并验证

      返回类型:
      - ValidationResult: { valid, errors?, data? }
      - ValidationError: { path, message, keyword?, params? }

      类型映射:
      - 'software-system' → 'system'
      - 'container' → 'container'
      - 'component' → 'component'
      - 'adr' → 'adr'
      - 'contract' → 'contract'
  interfaces:
    - name: validateDSL
      description: 验证 DSL 对象
    - name: validateDSLString
      description: 验证 YAML 字符串
    - name: validateDSLAuto
      description: 自动检测类型验证
    - name: ValidationResult
      description: 验证结果类型
