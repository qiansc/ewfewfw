schema: c4a/v1
type: component
component:
  id: cli-command-handler
  name: CLI Command Handler
  description: 命令处理器，实现所有 CLI 命令的执行逻辑
  technology: TypeScript
relationships:
  - to: cli-process-manager
    description: 调用进程管理功能
  - to: cli-docker-utils
    description: 调用 Docker 操作功能
knowledge:
  responsibility: 实现 dev, docker, prod, debug, status, stop, logs, clean, install, test 等命令
  how:
    description: |
      源码位置: packages/cli/src/commands/index.ts

      导出 runCommand 函数，根据命令 ID 执行对应逻辑:
      - dev: 启动存储服务 + mcp-data + ttyd
      - docker: 全容器化启动
      - prod: 生产模式启动
      - debug:dsl/code/data: 前台调试单个 MCP 服务
      - status: 显示服务运行状态
      - stop: 停止所有服务
  interfaces:
    - name: runCommand
      description: 执行指定命令
