schema: c4a/v1
type: component
component:
  id: dsl-converter
  name: DSL Converter
  description: DSL 类型转换器，在 DSL 文件类型与内部业务类型之间转换
  technology: TypeScript
relationships:
  - to: dsl-types
    description: 读取 DSL 类型
  - to: internal-types
    description: 输出内部类型
knowledge:
  responsibility: 提供 DSL 与内部类型的双向转换，以及类型保护函数
  how:
    description: |
      源码位置: packages/core/src/utils/converter.ts

      类型保护函数:
      - isSystemDSL(): 检查是否为 System DSL
      - isContainerDSL(): 检查是否为 Container DSL
      - isComponentDSL(): 检查是否为 Component DSL
      - isADRDSL(): 检查是否为 ADR DSL
      - isContractDSL(): 检查是否为 Contract DSL

      转换函数:
      - dslToSystem(): System DSL → Internal System
      - dslToContainer(): Container DSL → Internal Container
      - dslToComponent(): Component DSL → Internal Component

      辅助函数:
      - convertKnowledge(): 知识字段转换
      - convertComponentKnowledge(): 组件知识转换
  interfaces:
    - name: isSystemDSL
      description: System DSL 类型保护
    - name: dslToSystem
      description: System DSL 转内部类型
    - name: dslToContainer
      description: Container DSL 转内部类型
    - name: dslToComponent
      description: Component DSL 转内部类型
