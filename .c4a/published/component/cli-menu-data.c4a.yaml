schema: c4a/v1
type: component
component:
  id: cli-menu-data
  name: CLI Menu Data
  description: 菜单数据定义，包含菜单树结构和命令帮助说明
  technology: TypeScript
relationships:
  - to: cli-app
    description: 被主应用导入渲染菜单
  - to: cli-command-handler
    description: 命令 ID 与命令处理器对应
knowledge:
  responsibility: 定义 CLI 的菜单结构、命令层级和帮助文档
  how:
    description: |
      源码位置: packages/cli/src/menuData.ts

      数据结构:
      - MenuItem 接口: id, label, description, children?, separator?
      - menuTree: 菜单树数组，支持嵌套子菜单
      - helpDescriptions: 命令 ID 到帮助说明的映射

      菜单层级:
      - dev, restart, docker, prod (顶级命令)
      - debug → dsl, code, data (子菜单)
      - server → status, stop, logs (子菜单)
      - clean → storage, local, all (子菜单)
  interfaces:
    - name: MenuItem
      description: 菜单项类型定义
    - name: menuTree
      description: 菜单树数据
    - name: helpDescriptions
      description: 命令帮助说明映射
