schema: c4a/v1
type: component
component:
  id: config-validator
  name: Config Validator
  description: 配置验证器，验证 c4a.config.yaml 的正确性
  technology: TypeScript + Zod
relationships:
  - to: config-schema
    description: 使用 Schema 进行验证
knowledge:
  responsibility: 使用 Zod Schema 验证统一配置文件的结构和内容
  how:
    description: |
      源码位置: packages/config-generator/src/validator.ts

      验证内容:
      - 配置结构符合 Schema
      - Agent 引用的工具存在
      - MCP Server 配置完整
      - defaultAgent 存在于 agents 中
  interfaces:
    - name: validateConfig
      description: 验证配置文件
