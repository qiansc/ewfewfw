schema: c4a/v1
type: component
component:
  id: json-schemas
  name: JSON Schemas
  description: C4A DSL 的 JSON Schema 定义集合，用于验证 DSL 文件的结构正确性
  technology: JSON Schema Draft-07
relationships:
  - to: ajv-validator
    description: 被 AJV 验证器加载和使用
knowledge:
  responsibility: 定义 C4A DSL 各类型的结构约束，供验证器进行 Schema 验证
  how:
    description: |
      源码位置: packages/core/src/schemas/

      包含的 Schema 文件:
      - c4a-system.schema.json: 系统层 DSL Schema
      - c4a-container.schema.json: 容器层 DSL Schema
      - c4a-component.schema.json: 组件层 DSL Schema
      - c4a-adr.schema.json: ADR 决策记录 Schema
      - c4a-contract.schema.json: 契约 DSL Schema
      - c4a-common.schema.json: 共用定义（relationships, knowledge 等）
      - c4a-constraints.schema.json: 约束定义
      - c4a-history.schema.json: 历史记录定义
      - c4a-risks.schema.json: 风险定义

      Schema 设计原则:
      - 使用 $ref 引用共用定义
      - 支持 additionalProperties 以允许扩展字段
      - 定义枚举值约束状态等字段
  interfaces:
    - name: c4a-system.schema.json
      description: 系统 DSL Schema
    - name: c4a-container.schema.json
      description: 容器 DSL Schema
    - name: c4a-component.schema.json
      description: 组件 DSL Schema
    - name: c4a-adr.schema.json
      description: ADR DSL Schema
