schema: c4a/v1
type: component
component:
  id: config-types
  name: Config Types
  description: 配置生成器类型定义，包含适配器接口和各平台配置格式
  technology: TypeScript
relationships:
  - to: adapter-base
    description: 定义 ConfigAdapter 接口供适配器实现
  - to: config-schema
    description: 引用 UnifiedConfig 类型
knowledge:
  responsibility: 定义配置生成器的所有类型接口
  how:
    description: |
      源码位置: packages/config-generator/src/types.ts

      核心类型:
      - TargetPlatform: 'opencode' | 'claude-sdk' | 'cursor' | 'all'
      - GenerateOptions: 生成选项（target, configPath, dryRun 等）
      - GenerateResult: 生成结果（success, platform, outputFiles）
      - ConfigAdapter: 适配器接口（platform, generate, validate）

      平台配置格式:
      - OpencodeConfig: OpenCode 配置结构
      - ClaudeSdkConfig: Claude SDK 配置结构
      - CursorConfig: Cursor 配置（纯文本）
  interfaces:
    - name: ConfigAdapter
      description: 适配器接口定义
    - name: GenerateOptions
      description: 生成选项类型
    - name: OpencodeConfig
      description: OpenCode 配置类型
    - name: ClaudeSdkConfig
      description: Claude SDK 配置类型
