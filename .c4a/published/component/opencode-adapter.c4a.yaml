schema: c4a/v1
type: component
component:
  id: opencode-adapter
  name: OpenCode Adapter
  description: OpenCode 平台适配器，生成 .opencode/opencode.json 配置
  technology: TypeScript
relationships:
  - to: adapter-base
    description: 继承适配器基类
knowledge:
  responsibility: 将统一配置转换为 OpenCode 格式，生成 opencode.json 和 command/*.md 文件
  how:
    description: |
      源码位置: packages/config-generator/src/adapters/opencode.ts

      输出文件:
      - .opencode/opencode.json: 主配置
      - .opencode/command/*.md: Skill 命令文件

      转换规则:
      - transport: stdio → type: local
      - transport: http → type: remote
      - allowedTools → permission: { "tool": "allow" }
  interfaces:
    - name: OpencodeAdapter
      description: OpenCode 适配器类
