schema: c4a/v1
type: component
component:
  id: cli-app
  name: CLI App
  description: CLI 主应用入口，管理交互式菜单状态和键盘输入处理
  technology: TypeScript + React (Ink)
relationships:
  - to: cli-cascade-menu
    description: 渲染级联菜单组件
  - to: cli-command-handler
    description: 调用命令执行函数
knowledge:
  responsibility: 管理菜单导航状态、处理用户键盘输入、协调各 UI 组件渲染
  how:
    description: |
      源码位置: packages/cli/src/App.tsx

      使用 Ink (React for CLI) 实现终端 UI:
      - 管理 selectedIndex, expandedId, focusLevel 等状态
      - useInput hook 处理方向键和回车键
      - 组合 Header, CascadeMenu, HelpPanel 组件
  interfaces:
    - name: App
      description: 主应用 React 组件
