schema: c4a/v1
type: component
component:
  id: cursor-adapter
  name: Cursor Adapter
  description: Cursor 平台适配器，生成 .cursorrules 配置
  technology: TypeScript
relationships:
  - to: adapter-base
    description: 继承适配器基类
knowledge:
  responsibility: 将统一配置转换为 Cursor 格式，生成 .cursorrules 文本文件
  how:
    description: |
      源码位置: packages/config-generator/src/adapters/cursor.ts

      输出文件:
      - .cursorrules: 规则文本文件

      转换规则:
      - Agent 定义转为文本描述
      - 工具列表转为可用工具说明
      - MCP 配置需通过 Cursor 设置界面手动配置
  interfaces:
    - name: CursorAdapter
      description: Cursor 适配器类
