schema: c4a/v1
type: component
component:
  id: env-config
  name: Environment Config
  description: 环境变量配置模板，定义所有可配置项及其默认值
  technology: dotenv
knowledge:
  responsibility: 集中管理 C4A 平台的所有环境变量配置
  how:
    description: |
      源码位置: .env.example（模板），.env（实际配置，gitignore）

      ## 配置分类

      **应用配置:**
      - DEBUG: 调试模式 (true/false)

      **MongoDB 配置:**
      - MONGODB_URI: mongodb://localhost:27017/c4a
      - MONGODB_PORT: 27017

      **Neo4j 配置:**
      - NEO4J_URI: bolt://localhost:7687
      - NEO4J_USER: neo4j
      - NEO4J_PASSWORD: c4a_password（生产环境需修改）
      - NEO4J_HTTP_PORT: 7474
      - NEO4J_BOLT_PORT: 7687

      **Milvus 配置:**
      - MILVUS_URI: http://localhost:19530

      **MCP 服务端口:**
      - DATA_MCP_PORT: 8050
      - DSL_MCP_PORT: 8051（Docker 模式）
      - CODE_MCP_PORT: 8052（Docker 模式）

      **LLM 配置（对话模型）:**
      - LLM_PROVIDER: anthropic（默认）或 openai
      - ANTHROPIC_API_KEY: Claude API Key
      - ANTHROPIC_BASE_URL: API 基础 URL（可选）
      - ANTHROPIC_MODEL: claude-opus-4-5-20251101

      **Embedding 配置（向量模型）:**
      优先级: OPENAI_API_KEY > OLLAMA_HOST

      OpenAI Embedding:
      - OPENAI_API_KEY: OpenAI API Key
      - OPENAI_BASE_URL: API 基础 URL（可选）
      - EMBEDDING_MODEL: text-embedding-3-small（1536 维）

      Ollama Embedding:
      - OLLAMA_HOST: http://localhost:11434
      - OLLAMA_EMBEDDING_MODEL: nomic-embed-text（768 维）

      ## 升级注意事项

      - 新增配置项需同步更新 .env.example
      - 修改默认值需检查所有引用位置
      - Embedding 维度变更需要重建 Milvus 索引
  interfaces:
    - name: .env.example
      description: 环境变量模板文件
    - name: .env
      description: 实际环境变量文件（gitignore）
  links:
    - type: repository
      url: ./.env.example
      description: 环境变量模板
