schema: c4a/v1
type: component
component:
  id: data-config
  name: Data Config
  description: 数据服务配置管理，从环境变量加载数据库连接配置
  technology: Python + dataclasses
relationships:
  - to: data-service
    description: 提供数据库连接配置
knowledge:
  responsibility: 加载和管理 MCP 数据服务的配置
  how:
    description: |
      源码位置: packages/mcp-data/c4a_data_mcp/config.py

      配置项:
      - mongodb_uri: MongoDB 连接字符串 (默认 mongodb://localhost:27017/c4a)
      - neo4j_uri: Neo4j Bolt 连接 (默认 bolt://localhost:7687)
      - neo4j_user/password: Neo4j 认证
      - milvus_uri: Milvus 连接 (默认 http://localhost:19530)
      - debug: 调试模式开关
      - project_root: 项目根目录

      项目根目录查找优先级:
      1. C4A_PROJECT_ROOT 环境变量
      2. .env 文件所在目录
      3. 当前工作目录（fallback）
  interfaces:
    - name: Config
      description: 配置数据类
    - name: get_config
      description: 获取配置单例
