schema: c4a/v1
type: container
container:
  id: mongodb
  name: MongoDB
  description: |
    文档数据库，存储 C4A 实体的主数据（System, Container, Component, ADR, Contract）。
    作为三库架构的主存储，所有实体数据首先写入 MongoDB，再同步到 Neo4j 和 Milvus。
  external: true
  technology:
    language: N/A
    framework: MongoDB 7.0
    runtime: Docker
    protocol: MongoDB Wire Protocol
relationships:
  - to: c4a-data-mcp
    description: 被 mcp-data 服务调用进行文档 CRUD
    technology: mongodb-client (Python)
knowledge:
  how:
    description: |
      ## Docker 配置

      镜像: mongo:7.0
      容器名: c4a-mongodb
      端口: 27017 (可通过 MONGODB_PORT 环境变量配置)
      数据卷: mongodb_data:/data/db

      ## 健康检查

      命令: mongosh localhost:27017/test --quiet
      间隔: 10s, 超时: 5s, 重试: 5次

      ## 环境变量

      - MONGODB_URI: mongodb://localhost:27017/c4a (连接字符串)
      - MONGODB_PORT: 27017 (端口映射)

      ## 数据集合

      - systems: 系统实体
      - containers: 容器实体
      - components: 组件实体
      - adrs: 架构决策记录
      - contracts: API 契约

      ## 升级注意事项

      - 版本升级需考虑数据迁移
      - 索引策略可能需要调整
  links:
    - type: documentation
      url: https://www.mongodb.com/docs/
      description: MongoDB 官方文档
