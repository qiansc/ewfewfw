schema: c4a/v1
type: container
container:
  id: ollama
  name: Ollama
  description: |
    本地 LLM 推理服务，提供文本向量化（Embedding）能力。
    默认使用 nomic-embed-text 模型生成 768 维向量，用于语义搜索。
  external: true
  technology:
    language: N/A
    framework: Ollama
    runtime: Docker
    protocol: HTTP REST API
relationships:
  - to: c4a-data-mcp
    description: 被 mcp-data 的 embedding-service 调用生成向量
    technology: HTTP API
  - to: milvus
    description: 生成的向量存入 Milvus
    technology: 768 维向量
knowledge:
  how:
    description: >
      ## Docker 配置


      镜像: ollama/ollama:latest

      容器名: c4a-ollama

      端口: 11434

      数据卷: ollama_data:/root/.ollama（模型存储）


      ## 初始化容器


      ollama-init 容器在首次启动时自动拉取 nomic-embed-text 模型（约 300MB）。

      如果模型已存在则跳过下载。


      ## 健康检查


      命令: ollama list

      间隔: 10s, 超时: 5s, 重试: 3次


      ## 环境变量


      - OLLAMA_HOST: http://localhost:11434 (本地) 或 http://ollama:11434 (Docker
      内)

      - OLLAMA_EMBEDDING_MODEL: nomic-embed-text (默认模型)


      ## Embedding 模型


      默认模型: nomic-embed-text

      向量维度: 768

      适用场景: 本地开发（无需 API Key）


      ## 备选方案


      如果设置了 OPENAI_API_KEY，系统会优先使用 OpenAI Embedding：

      - 模型: text-embedding-3-small

      - 向量维度: 1536

      - 适用场景: 生产环境（更高质量）


      ## 升级注意事项


      - 更换模型需要重新生成所有向量（维度可能不同）

      - 模型文件较大，首次下载需要时间
  links:
    - type: documentation
      url: https://ollama.com/library
      description: Ollama 模型库
