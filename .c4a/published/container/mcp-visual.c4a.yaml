schema: c4a/v1
type: container
container:
  id: mcp-visual
  name: Visual Service MCP
  description: 提供知识可视化能力的 MCP 服务，支持图片生成（Gemini 3 Pro Image）、图表渲染（Mermaid）、C4 架构图生成
  technology:
    language: TypeScript
    framework: modelcontextprotocol-sdk
    runtime: Bun
    protocol: MCP
  repository:
    path: packages/mcp-visual
relationships:
  - to: gemini-api
    description: 调用 Gemini 3 Pro Image API 生成图片
    technology: REST API
    external: true
  - to: neo4j
    description: 查询架构关系用于生成 C4 架构图
    technology: neo4j-driver
    external: true
knowledge:
  responsibility: 知识可视化服务，提供图片生成、图表渲染、C4 架构图、模板管理、存储管理能力
  how:
    description: |-
      核心工具：
      - c4a_visual_generate: 生成图片（AI 图片生成）
      - c4a_visual_render: 渲染图表（Mermaid）
      - c4a_visual_render_c4: 生成 C4 架构图（从 Neo4j 查询数据）
      - c4a_visual_list_templates: 列出可用模板
      - c4a_visual_render_template: 渲染模板（变量替换）
      - c4a_visual_save: 保存图片
      - c4a_visual_get_reference: 获取图片引用
      - c4a_visual_cleanup: 清理过期临时文件
      - c4a_visual_storage_stats: 获取存储统计
      - c4a_visual_get_style: 获取全局风格配置

      存储模式：
      - cache: 临时缓存（.c4a/cache/visual/temp/）
      - permanent: 永久存储（.c4a/assets/images/）
      - report: 报告专属（.c4a/reports/{report-id}/images/）

      注：本地开发默认使用 stdio 传输模式，Docker 部署可切换为 streamable-http
    components:
      - visual-gemini-renderer
      - visual-mermaid-renderer
      - visual-template-manager
      - visual-storage-manager
  links:
    - type: repository
      url: ./packages/mcp-visual
      description: 源码目录
