schema: c4a/v1
type: container
container:
  id: gemini-api
  name: Google Gemini API
  description: |
    Google Gemini 3 Pro Image API，提供高质量图片生成能力。
    用于 mcp-visual 的 AI 图片生成功能。
  external: true
  technology:
    language: N/A
    framework: Google Generative AI
    runtime: Cloud Service
    protocol: REST API
relationships:
  - to: mcp-visual
    description: 被 mcp-visual 的 visual-gemini-renderer 调用生成图片
    technology: REST API
knowledge:
  responsibility: 提供 AI 图片生成能力，支持高质量图片输出和文本渲染
  how:
    description: |
      ## API 端点

      https://generativelanguage.googleapis.com/v1beta/models/gemini-3-pro-image-preview:generateContent

      ## 环境变量

      - GEMINI_API_KEY: API 密钥（必需）

      ## 定价

      - 2K 图片: ~$0.134/张
      - 4K 图片: ~$0.24/张

      ## 特性

      - 高质量图片生成（2K/4K）
      - 卓越的文本渲染（94% 准确性）
      - 多语言支持
      - 支持宽高比：1:1, 16:9, 9:16, 4:3, 3:4
      - 支持格式：PNG, JPEG
  links:
    - type: documentation
      url: https://ai.google.dev/docs
      description: Google AI 开发者文档
