schema: c4a/v1
type: container
container:
  id: c4a-data-mcp
  name: C4A Data MCP Server
  description: |
    统一数据服务，封装 MongoDB/Neo4j/Milvus 三库操作。
    提供实体存取、语义搜索、依赖查询、影响分析等能力，
    内部实现三库数据自动同步。
  technology:
    language: Python
    framework: mcp + FastAPI
    runtime: Python 3.11+
    protocol: MCP (Stdio/HTTP)
  ports:
    - port: 8050
      protocol: HTTP
      description: MCP Streamable HTTP 端口
  repository:
    path: packages/mcp-data
relationships:
  - to: mongodb
    description: 主存储，存放 DSL 文档和元数据
    technology: pymongo
    external: true
  - to: neo4j
    description: 图索引，存放依赖关系和调用链
    technology: neo4j-driver
    external: true
  - to: milvus
    description: 向量索引，支持语义搜索
    technology: pymilvus
    external: true
knowledge:
  responsibility: |
    架构知识持久化服务，负责三库统一写入与同步、语义搜索、图遍历依赖查询、变更影响分析
  how:
    description: |
      高层工具（推荐使用）：
      - c4a_db_save_entity: 保存实体，自动同步三库
      - c4a_db_get_entity: 查询实体
      - c4a_db_delete_entity: 删除实体
      - c4a_db_search_semantic: 语义搜索
      - c4a_db_query_deps: 查询依赖关系
      - c4a_db_query_impact: 分析变更影响
      - c4a_db_sync_local: 从本地同步到知识库
      - c4a_db_sync_file: 同步单个文件

      低层工具（保底方案）：
      - c4a_db_exec_cypher: 执行原生 Cypher 查询

      Embedding 服务:
      - 优先使用 OpenAI API（需配置 OPENAI_API_KEY）
      - 备选使用本地 Ollama（nomic-embed-text）
    components:
      - data-service
      - mongodb-client
      - neo4j-client
      - milvus-client
      - embedding-service
  links:
    - type: repository
      url: ./packages/mcp-data
      description: 源码目录
    - type: documentation
      url: ./rfc2/11-embedding-service.md
      description: Embedding 服务设计
