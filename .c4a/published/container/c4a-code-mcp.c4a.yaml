schema: c4a/v1
type: container
container:
  id: c4a-code-mcp
  name: C4A Code MCP Server
  description: |
    代码分析与契约生成服务。
    提供代码结构分析、接口提取、AST 解析、
    API 契约生成（OpenAPI/AsyncAPI/Proto）功能。
  technology:
    language: TypeScript
    framework: "@modelcontextprotocol/sdk"
    runtime: Bun
    protocol: MCP (Stdio/HTTP)
  ports:
    - port: 8052
      protocol: HTTP
      description: MCP Streamable HTTP 端口（仅 Docker 模式）
  repository:
    path: packages/mcp-code
relationships:
  - to: c4a-core
    description: 使用共享的类型定义
    technology: TypeScript Import
knowledge:
  what:
    description: |
      C4A Code MCP Server 是代码智能分析服务，负责：
      - 代码结构分析（支持 TypeScript、Go、Python）
      - 接口和类型定义提取
      - AST 抽象语法树解析
      - API 契约文档生成
  why:
    description: |
      选择 TypeScript 实现是因为：
      - 可复用 TypeScript 解析能力
      - 与 DSL MCP 技术栈统一
      - 便于使用 zod 进行输入验证
  how:
    description: |
      核心工具：
      - c4a_code_extract: 从代码中提取接口、类型定义
      - c4a_code_analyze: 分析代码结构和依赖关系
      - c4a_code_ast: 获取代码的 AST 结构
      - c4a_code_contract: 从代码生成 API 契约
    components:
      - id: code-parser
        source: src/parsers/codeParser.ts
      - id: code-analyzer
        source: src/tools/analyze.ts
      - id: interface-extractor
        source: src/tools/extract.ts
      - id: contract-generator
        source: src/tools/contract.ts
      - id: ast-provider
        source: src/tools/ast.ts
  links:
    - type: repository
      url: ./packages/mcp-code
      description: 源码目录
