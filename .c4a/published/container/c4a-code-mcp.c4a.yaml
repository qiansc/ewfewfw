schema: c4a/v1
type: container
container:
  id: c4a-code-mcp
  name: C4A Code MCP Server
  description: |
    代码分析与契约生成服务。
    提供代码结构分析、接口提取、AST 解析、
    API 契约生成（OpenAPI/AsyncAPI/Proto）功能。
  technology:
    language: TypeScript
    framework: "@modelcontextprotocol/sdk"
    runtime: Bun
    protocol: MCP (Stdio/HTTP)
  ports:
    - port: 8052
      protocol: HTTP
      description: MCP Streamable HTTP 端口（仅 Docker 模式）
  repository:
    path: packages/mcp-code
relationships:
  - to: c4a-core
    description: 使用共享的类型定义
    technology: TypeScript Import
knowledge:
  responsibility: |
    代码智能分析服务，负责代码结构分析、接口提取、AST 解析、API 契约生成
  how:
    description: |
      核心工具：
      - c4a_code_extract: 从代码中提取接口、类型定义
      - c4a_code_analyze: 分析代码结构和依赖关系
      - c4a_code_ast: 获取代码的 AST 结构
      - c4a_code_contract: 从代码生成 API 契约
    components:
      - code-parser
      - code-analyzer
      - interface-extractor
      - contract-generator
      - ast-provider
  links:
    - type: repository
      url: ./packages/mcp-code
      description: 源码目录
