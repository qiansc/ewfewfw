schema: c4a/v1
type: container
container:
  id: neo4j
  name: Neo4j
  description: |
    图数据库，存储 C4A 实体之间的依赖关系，支持图遍历查询。
    用于依赖查询（c4a_db_query_deps）和影响分析（c4a_db_query_impact）。
  external: true
  technology:
    language: N/A
    framework: Neo4j 5.x Community
    runtime: Docker
    protocol: Bolt
relationships:
  - to: c4a-data-mcp
    description: 被 mcp-data 服务调用进行图查询
    technology: neo4j-client (Python)
knowledge:
  how:
    description: |
      ## Docker 配置

      镜像: neo4j:5-community
      容器名: c4a-neo4j
      端口:
        - 7474 (HTTP/Browser，可通过 NEO4J_HTTP_PORT 配置)
        - 7687 (Bolt，可通过 NEO4J_BOLT_PORT 配置)
      数据卷: neo4j_data:/data
      插件: APOC

      ## 健康检查

      命令: wget -q --spider http://localhost:7474
      间隔: 10s, 超时: 5s, 重试: 5次

      ## 环境变量

      - NEO4J_URI: bolt://localhost:7687 (Bolt 连接)
      - NEO4J_USER: neo4j (用户名)
      - NEO4J_PASSWORD: c4a_password (密码，生产环境需修改)
      - NEO4J_HTTP_PORT: 7474 (HTTP 端口)
      - NEO4J_BOLT_PORT: 7687 (Bolt 端口)

      ## 图结构

      节点类型: System, Container, Component, ADR, Contract
      关系类型: DEPENDS_ON, USES, CONTAINS, AFFECTS

      ## 升级注意事项

      - 版本升级可能需要数据迁移
      - APOC 插件版本需与 Neo4j 版本匹配
  links:
    - type: documentation
      url: https://neo4j.com/docs/
      description: Neo4j 官方文档
