version: "1.0"

instructions:
  - prompts/AGENTS.md

defaultAgent: c4a

agents:
  c4a:
    description: C4A 默认 Agent，全功能架构知识管理
    promptFile: ./prompts/c4a.md
    mode: primary
    allowedTools:
      # c4a-dsl-mcp: DSL 解析 (无 I/O)
      - c4a_dsl_parse
      - c4a_dsl_validate
      - c4a_dsl_generate
      - c4a_dsl_schema
      # c4a-dsl-mcp: 本地仓库操作 (.c4a/)
      - c4a_local_init_repo
      - c4a_local_list_files
      - c4a_local_read_file
      - c4a_local_write_file
      - c4a_local_transition_status
      # c4a-code-mcp: 代码分析
      - c4a_code_extract_modules
      - c4a_code_analyze_deps
      - c4a_code_generate_contract
      - c4a_code_parse_ast
      # c4a-data-mcp: 数据库操作
      - c4a_db_save_entity
      - c4a_db_get_entity
      - c4a_db_delete_entity
      - c4a_db_search_semantic
      - c4a_db_query_deps
      - c4a_db_query_impact
      - c4a_db_sync_file      # 推荐：单文件同步，避免超时
      - c4a_db_sync_local     # 批量同步（可能超时）
      - c4a_db_exec_cypher
      # c4a-visual-mcp: 可视化服务
      - c4a_visual_generate
      - c4a_visual_render
      - c4a_visual_list_templates
      - c4a_visual_render_template
      - c4a_visual_save
      - c4a_visual_get_reference
      - c4a_visual_render_c4
      - c4a_visual_cleanup
      - c4a_visual_storage_stats
      - c4a_visual_get_style
      # 基础工具
      - edit
      - read
    deniedTools: []

mcpServers:
  c4a-dsl-mcp:
    command: bun
    args: ["run", "./packages/mcp-dsl/src/index.ts"]
    transport: stdio

  c4a-code-mcp:
    command: bun
    args: ["run", "./packages/mcp-code/src/index.ts"]
    transport: stdio

  c4a-data-mcp:
    transport: http
    url: http://localhost:8050/mcp

  c4a-visual-mcp:
    command: bun
    args: ["run", "./packages/mcp-visual/src/index.ts"]
    transport: stdio

# =============================================================================
# Skills 定义 - ADR 工作流命令（精简版：4 个智能命令）
# 命名规则：使用 "/" 分隔路径，生成时转换为目录结构
# 例如：c4a/research → .claude/commands/c4a/research.md
# =============================================================================
skills:
  # ---------------------------------------------------------------------------
  # Research 命令（智能路由）
  # ---------------------------------------------------------------------------
  "c4a/research":
    description: 开始调研（支持 URL/仓库/MD/对话总结）
    category: research
    args: "[url|path|clean|list]"
    promptFile: prompts/skills/c4a-research.md
    tools:
      - bash
      - WebFetch
      - read
      - edit

  # ---------------------------------------------------------------------------
  # ADR 命令（智能路由）
  # ---------------------------------------------------------------------------
  "c4a/adr/draft":
    description: 创建 ADR 草稿
    category: adr-workflow
    promptFile: prompts/skills/c4a-adr-draft.md
    tools:
      - bash
      - read
      - c4a_dsl_generate
      - c4a_dsl_schema
      - c4a_local_write_file
      # 影响分析（可选，数据库可用时）
      - c4a_db_search_semantic
      - c4a_db_query_impact

  "c4a/adr/review":
    description: 开始评审（展示内容，进入对话模式）
    category: adr-workflow
    args: "<adr-id>"
    promptFile: prompts/skills/c4a-adr-review.md
    tools:
      - c4a_local_read_file
      - c4a_local_list_files
      - c4a_local_write_file
      - c4a_dsl_validate
      - c4a_local_transition_status
      - read
      # 影响分析（可选，数据库可用时）
      - c4a_db_search_semantic
      - c4a_db_query_impact

  "c4a/adr/status":
    description: 查看 ADR 状态
    category: adr-workflow
    args: "[adr-id|draft|approved|published]"
    promptFile: prompts/skills/c4a-adr-status.md
    tools:
      - c4a_local_read_file
      - c4a_local_list_files
