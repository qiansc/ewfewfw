[project]
name = "c4a-data-mcp"
version = "0.1.0"
description = "C4A Data MCP Server - Unified MongoDB + Neo4j + Milvus"
requires-python = ">=3.11"
dependencies = [
    "mcp>=0.9.0",
    "pymongo>=4.6.0",
    "neo4j>=5.16.0",
    "pymilvus>=2.4.0",
    "openai>=1.10.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "uvicorn>=0.27.0",
    "starlette>=0.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

[project.scripts]
c4a-data-mcp = "c4a_data_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["c4a_data_mcp"]

[tool.hatch.build.targets.sdist]
include = ["c4a_data_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
